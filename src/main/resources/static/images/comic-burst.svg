<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Halftone Pattern for Burst -->
    <pattern id="burst-dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#7a0010" opacity="0.35"/>
      <circle cx="6" cy="6" r="1.5" fill="#7a0010" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Solid Black Drop Shadow Polygon -->
  <polygon points="
    150,15 178,55 220,25 225,70 275,55 260,95 295,115 255,135 280,175 230,165 220,195
    180,175 150,195 120,175 80,195 70,165 20,175 45,135 5,115 40,95 25,55 75,70 80,25 122,55"
    fill="#111" transform="translate(6, 6)"/>

  <!-- Main Action Red Starburst -->
  <polygon points="
    150,15 178,55 220,25 225,70 275,55 260,95 295,115 255,135 280,175 230,165 220,195
    180,175 150,195 120,175 80,195 70,165 20,175 45,135 5,115 40,95 25,55 75,70 80,25 122,55"
    fill="#e63946" stroke="#111" stroke-width="5" stroke-linejoin="round"/>

  <!-- Halftone Dots Overlay -->
  <polygon points="
    150,15 178,55 220,25 225,70 275,55 260,95 295,115 255,135 280,175 230,165 220,195
    180,175 150,195 120,175 80,195 70,165 20,175 45,135 5,115 40,95 25,55 75,70 80,25 122,55"
    fill="url(#burst-dots)"/>

  <!-- Inner Yellow Starburst Highlight -->
  <polygon points="
    150,35 170,65 205,42 208,75 248,68 235,98 265,112 232,128 250,158 212,150 202,175
    172,160 150,175 128,160 98,175 88,150 50,158 68,128 35,112 65,98 52,68 92,75 95,42 130,65"
    fill="#ffdd00" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
</svg>
