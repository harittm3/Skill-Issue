<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Vintage Newsprint / Sketch Background -->
  <rect width="400" height="300" fill="#f4ede1"/>

  <!-- Background Crosshatch Pattern (Subtle Noir Inking) -->
  <g stroke="#2b2d42" stroke-width="1.2" opacity="0.18">
    <line x1="0" y1="50" x2="300" y2="0"/>
    <line x1="0" y1="90" x2="350" y2="0"/>
    <line x1="0" y1="130" x2="400" y2="0"/>
    <line x1="0" y1="170" x2="400" y2="40"/>
    <line x1="0" y1="210" x2="400" y2="80"/>
    <line x1="0" y1="250" x2="400" y2="120"/>
    <line x1="50" y1="300" x2="400" y2="160"/>
    <line x1="120" y1="300" x2="400" y2="200"/>
    <line x1="200" y1="300" x2="400" y2="240"/>
  </g>

  <!-- Ground / Table Horizon Line -->
  <line x1="0" y1="230" x2="400" y2="230" stroke="#111" stroke-width="4"/>
  <!-- Table Edge Shadow Hatching -->
  <g stroke="#111" stroke-width="1.8" opacity="0.35">
    <line x1="20" y1="235" x2="35" y2="255"/>
    <line x1="50" y1="235" x2="65" y2="255"/>
    <line x1="80" y1="235" x2="95" y2="255"/>
    <line x1="110" y1="235" x2="125" y2="255"/>
    <line x1="140" y1="235" x2="155" y2="255"/>
    <line x1="170" y1="235" x2="185" y2="255"/>
    <line x1="200" y1="235" x2="215" y2="255"/>
    <line x1="230" y1="235" x2="245" y2="255"/>
    <line x1="260" y1="235" x2="275" y2="255"/>
    <line x1="290" y1="235" x2="305" y2="255"/>
    <line x1="320" y1="235" x2="335" y2="255"/>
    <line x1="350" y1="235" x2="365" y2="255"/>
  </g>

  <!-- Coffee Mug on the Left -->
  <g>
    <!-- Cast Shadow -->
    <ellipse cx="65" cy="235" rx="35" ry="10" fill="#111" opacity="0.3"/>
    <!-- Mug Body -->
    <path d="M45,170 L50,230 Q65,236 80,230 L85,170 Z" fill="#ffffff" stroke="#111" stroke-width="3.5"/>
    <!-- Mug Top Rim -->
    <ellipse cx="65" cy="170" rx="20" ry="7" fill="#fdfaf3" stroke="#111" stroke-width="3.5"/>
    <!-- Coffee Inside -->
    <ellipse cx="65" cy="172" rx="16" ry="5" fill="#3a1e05"/>
    <!-- Mug Handle -->
    <path d="M83,180 Q105,185 102,210 Q98,225 80,222" fill="none" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Crosshatch shadow on Mug -->
    <g stroke="#111" stroke-width="1.8" opacity="0.6">
      <line x1="50" y1="190" x2="60" y2="225"/>
      <line x1="56" y1="185" x2="66" y2="228"/>
      <line x1="62" y1="190" x2="72" y2="225"/>
    </g>
    <!-- Steam Swirls -->
    <path d="M58,155 Q50,140 60,125 Q70,110 65,95" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M72,150 Q80,135 72,120 Q65,105 72,90" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- Laptop in Isometric / 3/4 Ink View -->
  <g>
    <!-- Laptop Base Cast Shadow -->
    <polygon points="120,245 365,248 385,235 155,230" fill="#111" opacity="0.35"/>
    
    <!-- Laptop Base (Lower Chassis) -->
    <polygon points="135,225 350,225 375,210 170,210" fill="#e2dad0" stroke="#111" stroke-width="4"/>
    <polygon points="135,225 135,234 350,234 350,225" fill="#c4b8aa" stroke="#111" stroke-width="4"/>
    <polygon points="350,225 375,210 375,219 350,234" fill="#9f9282" stroke="#111" stroke-width="4"/>
    
    <!-- Trackpad -->
    <polygon points="215,224 275,224 280,218 220,218" fill="#d2c8bc" stroke="#111" stroke-width="2"/>
    
    <!-- Keyboard Grid (Stylized Ink Lines) -->
    <polygon points="160,218 340,218 358,212 180,212" fill="#2b2d42" stroke="#111" stroke-width="2"/>
    <g stroke="#ffd166" stroke-width="1.2" opacity="0.8">
      <line x1="165" y1="215" x2="345" y2="215"/>
      <!-- Key columns -->
      <line x1="190" y1="218" x2="200" y2="212"/>
      <line x1="220" y1="218" x2="230" y2="212"/>
      <line x1="250" y1="218" x2="260" y2="212"/>
      <line x1="280" y1="218" x2="290" y2="212"/>
      <line x1="310" y1="218" x2="320" y2="212"/>
    </g>

    <!-- Laptop Display Lid (Upright, slightly tilted) -->
    <polygon points="170,210 375,210 355,75 150,75" fill="#111116" stroke="#111" stroke-width="4.5"/>
    <!-- Screen Bezel -->
    <polygon points="175,204 368,204 350,85 158,85" fill="#0b132b" stroke="#111" stroke-width="2"/>
    
    <!-- Screen Content: Glowing Code & Bug Error -->
    <polygon points="178,200 364,200 348,89 162,89" fill="#1c2541"/>
    <!-- Terminal Lines on Screen -->
    <g fill="#00b4d8" opacity="0.9">
      <rect x="170" y="96" width="45" height="4"/>
      <rect x="172" y="106" width="75" height="4"/>
      <rect x="175" y="116" width="110" height="4"/>
      <rect x="178" y="126" width="90" height="4"/>
    </g>
    <!-- RED ERROR LINE ON SCREEN -->
    <g fill="#ef233c">
      <rect x="180" y="142" width="135" height="7"/>
      <!-- Warning Triangle -->
      <polygon points="325,148 335,135 345,148" fill="#ffd166" stroke="#111" stroke-width="1.5"/>
    </g>
    <!-- Output Code Lines -->
    <g fill="#06d6a0" opacity="0.8">
      <rect x="185" y="160" width="85" height="4"/>
      <rect x="188" y="170" width="120" height="4"/>
      <rect x="191" y="180" width="55" height="4"/>
    </g>

    <!-- Screen Glare Diagonal Lines -->
    <line x1="190" y1="90" x2="320" y2="200" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
    <line x1="210" y1="90" x2="340" y2="200" stroke="#ffffff" stroke-width="3" opacity="0.12"/>
  </g>

  <!-- Floating Question Marks / Bug Icons -->
  <text x="350" y="70" font-family="'Bangers', Impact, sans-serif" font-size="28" fill="#ef233c" stroke="#111" stroke-width="1.5" transform="rotate(15 350 70)">?!</text>

  <!-- Comic Outer Border -->
  <rect x="2" y="2" width="396" height="296" fill="none" stroke="#111" stroke-width="5"/>
</svg>
