<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <!-- Ben-Day Halftone Pattern for skin / shadow -->
    <pattern id="eyes-dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#005f73" opacity="0.4"/>
      <circle cx="6" cy="6" r="1.5" fill="#005f73" opacity="0.4"/>
    </pattern>
    <linearGradient id="eyes-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a9396"/>
      <stop offset="100%" stop-color="#005f73"/>
    </linearGradient>
  </defs>

  <!-- Background with Halftone -->
  <rect width="400" height="200" fill="url(#eyes-bg)"/>
  <rect width="400" height="200" fill="url(#eyes-dots)"/>

  <!-- Dramatic Shadow on Top and Left -->
  <polygon points="0,0 400,0 400,45 0,80" fill="#032b30" opacity="0.75"/>
  <polygon points="0,0 120,0 70,200 0,200" fill="#032b30" opacity="0.6"/>

  <!-- Speed Lines / Action Focus Lines -->
  <g stroke="#94d2bd" stroke-width="2" opacity="0.3">
    <line x1="0" y1="20" x2="120" y2="75"/>
    <line x1="0" y1="60" x2="130" y2="85"/>
    <line x1="400" y1="20" x2="280" y2="75"/>
    <line x1="400" y1="60" x2="270" y2="85"/>
    <line x1="400" y1="180" x2="290" y2="140"/>
  </g>

  <!-- Comic Eyes Group -->
  <!-- LEFT EYE -->
  <g>
    <!-- Heavy Eyebrow -->
    <path d="M50,70 Q110,40 180,68 Q130,55 50,70 Z" fill="#111" stroke="#111" stroke-width="3"/>
    <path d="M60,65 L80,50" stroke="#111" stroke-width="3"/>
    <path d="M90,60 L110,45" stroke="#111" stroke-width="3"/>

    <!-- Upper Eyelid & Eyelash Line (Thick Ink) -->
    <path d="M70,95 Q125,65 175,90" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Eye White -->
    <path d="M75,95 Q125,70 170,92 Q125,125 75,95 Z" fill="#ffffff" stroke="#111" stroke-width="2"/>
    
    <!-- Iris & Pupil (Intense Cyan/Blue Glowing) -->
    <ellipse cx="125" cy="95" rx="20" ry="18" fill="#00b4d8" stroke="#111" stroke-width="3"/>
    <ellipse cx="125" cy="95" rx="11" ry="10" fill="#111"/>
    <!-- Catchlight / Glint -->
    <circle cx="120" cy="90" r="4.5" fill="#ffffff"/>
    <circle cx="132" cy="100" r="2.5" fill="#ffffff"/>

    <!-- Lower Eyelid -->
    <path d="M85,105 Q125,122 165,100" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Under Eye Tension Crease / Noir Shadow -->
    <path d="M90,118 Q125,130 160,115" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
    <!-- Crosshatch shadow under eye -->
    <line x1="100" y1="120" x2="110" y2="135" stroke="#111" stroke-width="2"/>
    <line x1="115" y1="122" x2="125" y2="137" stroke="#111" stroke-width="2"/>
    <line x1="130" y1="120" x2="140" y2="135" stroke="#111" stroke-width="2"/>
  </g>

  <!-- NOSE BRIDGE / FURROWED BROW CREASES -->
  <g stroke="#111" stroke-width="3" fill="none">
    <path d="M190,65 Q195,85 190,105"/>
    <path d="M210,65 Q205,85 210,105"/>
    <path d="M195,78 L205,78"/>
    <path d="M193,88 L207,88"/>
  </g>

  <!-- RIGHT EYE -->
  <g>
    <!-- Heavy Eyebrow -->
    <path d="M350,70 Q290,40 220,68 Q270,55 350,70 Z" fill="#111" stroke="#111" stroke-width="3"/>
    <path d="M340,65 L320,50" stroke="#111" stroke-width="3"/>
    <path d="M310,60 L290,45" stroke="#111" stroke-width="3"/>

    <!-- Upper Eyelid & Eyelash Line (Thick Ink) -->
    <path d="M330,95 Q275,65 225,90" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Eye White -->
    <path d="M325,95 Q275,70 230,92 Q275,125 325,95 Z" fill="#ffffff" stroke="#111" stroke-width="2"/>
    
    <!-- Iris & Pupil (Intense Cyan/Blue Glowing) -->
    <ellipse cx="275" cy="95" rx="20" ry="18" fill="#00b4d8" stroke="#111" stroke-width="3"/>
    <ellipse cx="275" cy="95" rx="11" ry="10" fill="#111"/>
    <!-- Catchlight / Glint -->
    <circle cx="270" cy="90" r="4.5" fill="#ffffff"/>
    <circle cx="282" cy="100" r="2.5" fill="#ffffff"/>

    <!-- Lower Eyelid -->
    <path d="M315,105 Q275,122 235,100" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Under Eye Tension Crease / Noir Shadow -->
    <path d="M310,118 Q275,130 240,115" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
    <!-- Crosshatch shadow under eye -->
    <line x1="290" y1="120" x2="280" y2="135" stroke="#111" stroke-width="2"/>
    <line x1="275" y1="122" x2="265" y2="137" stroke="#111" stroke-width="2"/>
    <line x1="260" y1="120" x2="250" y2="135" stroke="#111" stroke-width="2"/>
  </g>

  <!-- Comic Outer Border -->
  <rect x="2" y="2" width="396" height="196" fill="none" stroke="#111" stroke-width="5"/>
</svg>
